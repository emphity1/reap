version: 2

project_name: reap

builds:
  - main: ./cmd/reap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Multi-arch image pushed to GHCR on release (one manifest, amd64+arm64).
# The static binary needs no RUN steps, so buildx cross-builds both arches
# without emulation.
dockers_v2:
  - images:
      - ghcr.io/emphity1/reap
    tags:
      - "{{ .Tag }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: reap
      org.opencontainers.image.description: Lint Kubernetes manifests for GPU waste and ML misconfigurations
      org.opencontainers.image.source: https://github.com/emphity1/reap
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - "^docs"
      - "^test"

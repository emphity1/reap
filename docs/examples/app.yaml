# The README's example input. `reap docs/examples/app.yaml` reproduces the
# output shown there verbatim: two objects, one finding.
#
# The Deployment requests a GPU but sets no limit. Kubernetes treats GPUs as
# extended resources and rejects requests without an equal limit, so this
# Deployment never deploys — reap catches it in CI instead of at rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: server
          image: ghcr.io/example/llm-api:1.0
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
---
# The Job is clean: GPU request and limit are equal, the run has a deadline,
# /dev/shm is memory-backed, and the pod tolerates the GPU node taint.
apiVersion: batch/v1
kind: Job
metadata:
  name: finetune
  namespace: ml
spec:
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: trainer
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1

# Passing fixtures for the job-no-deadline rule.
#
# Deadline set: a hung run is killed and its GPUs are freed.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-resnet
  namespace: ml
spec:
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          resources:
            limits:
              nvidia.com/gpu: 4
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-embeddings
  namespace: ml
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: embed
              image: ghcr.io/example/embedder:1.2
              resources:
                limits:
                  nvidia.com/gpu: 1
---
# CPU-only job: out of scope for a GPU linter, deadline or not.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-backup
  namespace: infra
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: backup
          image: postgres:16

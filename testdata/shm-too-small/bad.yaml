# Failing fixtures for the shm-too-small rule.
#
# GPU training job with no /dev/shm mount: Kubernetes caps /dev/shm at 64 MB
# by default, and PyTorch DataLoader workers crash into cryptic bus errors
# the first time a batch doesn't fit.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-resnet
  namespace: ml
spec:
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          resources:
            limits:
              nvidia.com/gpu: 4
---
# Subtler variant: /dev/shm is mounted, but the emptyDir is disk-backed —
# without medium: Memory it is not shared memory at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: ml
spec:
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
    spec:
      volumes:
        - name: shm
          emptyDir: {}
      containers:
        - name: embedder
          image: ghcr.io/example/embedder:1.2
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            limits:
              nvidia.com/gpu: 1

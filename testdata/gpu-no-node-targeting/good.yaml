# Passing fixtures for the gpu-no-node-targeting rule.
#
# Toleration for the canonical GPU node taint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-api
  namespace: ml
spec:
  selector:
    matchLabels:
      app: llm-api
  template:
    metadata:
      labels:
        app: llm-api
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: server
          image: ghcr.io/example/llm-api:1.0
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            limits:
              nvidia.com/gpu: 1
---
# Node selector on a GPU-operator label works too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: ml
spec:
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: embedder
          image: ghcr.io/example/embedder:1.2
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            limits:
              nvidia.com/gpu: 1
---
# No GPUs: node targeting is not this linter's business.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27

# Passing fixtures for the no-gpu-limit rule.
#
# GPU limit set; for extended resources the request defaults to the limit,
# so declaring only the limit is also valid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      containers:
        - name: server
          image: vllm/vllm-openai:v0.5.0
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
---
# No GPUs at all — out of scope for this rule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          resources:
            limits:
              cpu: "1"
              memory: 256Mi

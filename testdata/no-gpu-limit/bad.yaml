# Failing fixtures for the no-gpu-limit rule.
#
# The container requests a GPU but sets no limit. Kubernetes treats GPUs as
# extended resources and rejects requests without an equal limit, so this
# Deployment never deploys — reap catches it in CI instead of at rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: server
          image: ghcr.io/example/llm-api:1.0
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
---
# GPU request and limit disagree — Kubernetes requires them to be equal.
apiVersion: batch/v1
kind: Job
metadata:
  name: finetune
  namespace: ml
spec:
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: trainer
          image: pytorch/pytorch:2.3.0-cuda12.1-cudnn8-runtime
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 2

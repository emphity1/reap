# Minimal GPU override for vllm/vllm-stack 0.1.11: enable one serving engine
# with a plain nvidia.com/gpu request (the chart's example entry is disabled
# and uses a MIG resource type). Keys verified against
# `helm show values vllm/vllm-stack --version 0.1.11`.
servingEngineSpec:
  modelSpec:
    - name: "opt125m"
      enabled: true
      repository: "vllm/vllm-openai"
      tag: "v0.9.2"
      modelURL: "facebook/opt-125m"
      replicaCount: 1
      requestCPU: 6
      requestMemory: "16Gi"
      requestGPU: 1
      requestGPUType: "nvidia.com/gpu"

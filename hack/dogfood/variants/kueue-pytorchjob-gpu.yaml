# Derived detector probe — NOT a pristine upstream manifest.
# Base: kubernetes-sigs/kueue v0.13.0 site/static/examples/jobs/sample-pytorchjob.yaml
# Delta: the GPU image swap the upstream file itself suggests in comments
#        ("If you have gpu, pytorch-mnist-gpu would be helpful"), plus the
#        matching nvidia.com/gpu request/limit on both replicas.
# Oracle: GPU multi-replica PyTorchJob WITH a Kueue queue label — the
# gang-scheduling rule must stay silent. See pytorchjob-gpu-noqueue.yaml for
# the control without the label.
apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: pytorch-simple-gpu
  namespace: kueue-gang-probe
  labels:
    kueue.x-k8s.io/queue-name: user-queue
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: docker.io/kubeflowkatib/pytorch-mnist-gpu:v1beta1-45c5727
              imagePullPolicy: Always
              command:
                - "python3"
                - "/opt/pytorch-mnist/mnist.py"
                - "--epochs=1"
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: docker.io/kubeflowkatib/pytorch-mnist-gpu:v1beta1-45c5727
              imagePullPolicy: Always
              command:
                - "python3"
                - "/opt/pytorch-mnist/mnist.py"
                - "--epochs=1"
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
